<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>

    <!-- Shield Neon Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6B11FF" />
    </linearGradient>

    <!-- Shield Inner Fill -->
    <linearGradient id="shieldInnerGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1A2639" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E1626" stop-opacity="0.95" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00C9FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00F2FE" stroke-opacity="0.15" stroke-width="2" />

  <!-- Aegis Shield Outer Path (Glow) -->
  <path d="M 256,75 
           C 345,100 405,130 405,220
           C 405,335 320,405 256,445
           C 192,405 107,335 107,220
           C 107,130 167,100 256,75 Z"
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="8" 
        filter="url(#neonGlow)" />

  <!-- Aegis Shield Inner Body -->
  <path d="M 256,88 
           C 335,110 390,138 390,220
           C 390,325 312,390 256,428
           C 200,390 122,325 122,220
           C 122,138 177,110 256,88 Z"
        fill="url(#shieldInnerGrad)" 
        stroke="#2A3B53" 
        stroke-width="2" />

  <!-- Circuit Pattern Lines Inside Shield -->
  <path d="M 170,180 L 220,180 L 240,210" fill="none" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
  <circle cx="170" cy="180" r="4" fill="#00F2FE" fill-opacity="0.5" />

  <path d="M 342,180 L 292,180 L 272,210" fill="none" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
  <circle cx="342" cy="180" r="4" fill="#00F2FE" fill-opacity="0.5" />

  <!-- Fast Fetch Arrow & Download Elements -->
  <!-- Upper Data Stream Bar -->
  <rect x="238" y="145" width="36" height="6" rx="3" fill="#00F2FE" opacity="0.6" />
  <rect x="246" y="160" width="20" height="6" rx="3" fill="#00F2FE" opacity="0.8" />

  <!-- Download Arrow -->
  <path d="M 236,180 L 276,180 L 276,270 L 320,270 L 256,345 L 192,270 L 236,270 Z" 
        fill="url(#arrowGrad)" 
        filter="url(#neonGlow)" />

  <!-- Base Catch Tray (Data Shelf) -->
  <path d="M 185,360 L 210,380 L 302,380 L 327,360" 
        fill="none" 
        stroke="#00F2FE" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <circle cx="256" cy="380" r="3.5" fill="#FFFFFF" />
</svg>
