name: AegisFetch Security & Functional CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: JavaScript Syntax Check (Web UI & MV3 Extension)
        run: |
          node --check web_ui_static/app.js
          node --check chrome_extension/shared.js
          node --check chrome_extension/popup.js
          node --check chrome_extension/background.js

      - name: Run AegisFetch Offline Security & Unit Test Suite
        run: |
          python test_mcp_security.py --offline
