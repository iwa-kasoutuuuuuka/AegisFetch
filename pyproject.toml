[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisfetch"
version = "2.2.1"
description = "High-resilience, anti-403, and WAF-evading catalog & document downloader with MCP Server & Web UI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "iwa-kasoutuuuuuka"}
]
dependencies = [
    "curl_cffi>=0.7.0",
    "mcp>=2.3.0",
    "openpyxl>=3.1.0"
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0"
]

[project.scripts]
aegisfetch = "aegisfetch:main"
aegisfetch-mcp = "mcp_server:main"
aegisfetch-ui = "web_ui:main"

[tool.setuptools]
py-modules = ["aegisfetch", "mcp_server", "security", "extractors", "web_ui", "proxy_manager"]
